<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Дашборд</title>
<!-- Версія сторінки: змінюється при кожному оновленні, за нею телефон розуміє, що треба перезавантажитись -->
<meta name="app-version" content="0.4.0">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a111d">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Базовий розмір шрифту залежить від меншої сторони екрана, тому все масштабується під будь-який пристрій */
html{font-size:3vmin}
html,body{height:100%;margin:0;background:#0a111d;color:#fff;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;cursor:default}
body{font-family:Roboto,"Helvetica Neue",Arial,sans-serif}
#app{position:absolute;top:0;right:0;bottom:0;left:0;padding:1.2rem;display:flex;flex-direction:column}
#top{flex:1 1 0;min-height:0;display:flex;flex-direction:row}
#left{flex:0 0 calc(50% - .6rem);width:calc(50% - .6rem);min-width:0;display:flex;flex-direction:column;justify-content:center}
#date{font-size:2.5rem;color:#c9d4e6;white-space:nowrap;padding-left:.4rem}
#clockwrap{position:relative;display:inline-block;align-self:flex-start;margin:.6rem 0 .8rem .2rem;padding:.7rem 2rem .9rem}
#frame{position:absolute;top:0;left:0;width:100%;height:100%;overflow:visible}
#frame path{fill:none;stroke-linecap:round}
#frametrack{stroke:rgba(255,255,255,.14)}
#frameprog{stroke:#5aa9ff;stroke-dasharray:100;stroke-dashoffset:100}
#clock{position:relative;font-size:9.4rem;line-height:.9;font-weight:300;letter-spacing:-.02em;white-space:nowrap}
#sec{font-size:3.6rem;color:#8da2c4;margin-left:.6rem;letter-spacing:0}
#sun{display:flex;padding-left:.4rem}
.sunitem{margin-right:2.6rem;color:#8da2c4;font-size:1.5rem}
.sunitem b{display:block;font-size:2.6rem;font-weight:400;color:#e6edf8;margin-top:.1rem}
.card{background:#142038;border-radius:1.2rem;padding:.9rem 1.3rem;min-width:0}
#wx{flex:0 0 calc(50% - .6rem);width:calc(50% - .6rem);margin-left:1.2rem;display:flex;flex-direction:column;
  background:linear-gradient(160deg,#4a86d6,#2b4f8c)}
#wxhead{display:flex;justify-content:space-between;white-space:nowrap;font-size:1.4rem;color:#d7e6ff;text-transform:uppercase;letter-spacing:.06em;min-height:1.6rem}
#wxwarn{color:#ffd27a;text-transform:none;letter-spacing:0}
#wxmain{display:flex;align-items:center;margin-top:.2rem}
#wxicon{width:5.2rem;height:5.2rem;flex:none}
#wxicon svg,.dayicon svg{width:100%;height:100%;display:block}
#temp{font-size:5.4rem;font-weight:300;line-height:1;margin-left:1rem;white-space:nowrap}
#nexthour{font-size:1.6rem;color:#d7e6ff;margin-top:.1rem;min-height:1.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#wxdetails{display:flex;margin-top:.4rem;padding-top:.4rem;border-top:1px solid rgba(255,255,255,.25)}
.stat{flex:1;font-size:1.3rem;color:#d7e6ff;white-space:nowrap}
.stat:first-child{flex:1.35}
.stat b{display:block;font-size:2rem;font-weight:400;color:#fff}
#days{margin-top:.5rem;padding-top:.3rem;border-top:1px solid rgba(255,255,255,.25)}
.day{display:flex;align-items:center;height:2.5rem;font-size:2rem}
.dayname{flex:1}
.dayicon{width:2.3rem;height:2.3rem;margin:0 1rem}
.daytemp{min-width:7rem;text-align:right}
.daytemp span{color:#b9cdee}
#wx.stale #wxmain,#wx.stale #nexthour,#wx.stale #wxdetails,#wx.stale #days{opacity:.55}
#bottom{display:flex;flex-direction:row;margin-top:1rem;height:7.2rem;flex:none}
#bottom .card{flex:0 0 calc(50% - .6rem);width:calc(50% - .6rem);margin-right:1.2rem}
#bottom .card:last-child{margin-right:0}
.soon{border:1px dashed #33476b;background:transparent;opacity:.75}
.soon h4{margin:0 0 .3rem;font-size:1.3rem;color:#8da2c4;text-transform:uppercase;letter-spacing:.06em;font-weight:400}
.soon p{margin:0;font-size:1.7rem;color:#c9d4e6}
#status{position:absolute;right:1.4rem;bottom:.25rem;font-size:1.05rem;color:#8da2c4;opacity:.55}
/* Блок «Світло» */
#powercard{display:block;padding:.7rem 1.2rem;overflow:hidden}
#phead{display:flex;justify-content:space-between;align-items:baseline;white-space:nowrap;font-size:1.25rem;color:#8da2c4;text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
#pstatus{font-size:1.7rem;text-transform:none;letter-spacing:0;font-weight:500;color:#6ee7a0;overflow:hidden;text-overflow:ellipsis}
#pstatus.off{color:#ff8a8a}
#pstatus.maybe{color:#f5b83d}
#pstatus.dim{color:#8da2c4;font-weight:400}
.prow{display:flex;align-items:center;margin-top:.25rem}
.plbl{width:4.8rem;flex:none;font-size:1.05rem;color:#8da2c4}
.pwrap{position:relative;flex:1;min-width:0}
.pbar{display:flex;height:1rem;border-radius:.3rem;overflow:hidden;background:#1d2b46}
.thin .pbar{height:.55rem}
.pbar i{flex:1;display:block;background:#33476b}
.pbar i.g{background:#2fbf71}
.pbar i.r{background:#e5484d}
.pbar i.y{background:#f5b83d}
.pbar i.p{opacity:.45}
.pbar i:nth-child(2n+1){border-left:1px solid rgba(10,17,29,.45)}
.pbar i:nth-child(12n+1){border-left-color:rgba(10,17,29,.95)}
#pnow{position:absolute;top:-.25rem;bottom:-.25rem;width:2px;margin-left:-1px;background:#fff;border-radius:1px;left:0}
#pticks{position:relative;flex:1;height:1.1rem;font-size:.95rem;color:#8da2c4}
#pticks span{position:absolute;top:0;transform:translateX(-50%);-webkit-transform:translateX(-50%)}
#pticks span:first-child{transform:none;-webkit-transform:none}
#pticks span:last-child{transform:translateX(-100%);-webkit-transform:translateX(-100%)}
#powercard.stale .prow,#powercard.stale #pstatus{opacity:.55}
#pnone{display:none;font-size:1.6rem;color:#c9d4e6;margin-top:.5rem;line-height:1.25}
#powercard.noprov #pnone{display:block}
#powercard.noprov .prow{display:none}
/* Шестерня та панель налаштувань */
#gear{position:absolute;left:.3rem;bottom:0;width:3.8rem;height:2.8rem;display:flex;align-items:center;justify-content:center;opacity:.3;color:#8da2c4;z-index:5;cursor:pointer}
#gear svg{width:1.5rem;height:1.5rem;display:block}
#ovl{display:none;position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(5,9,15,.94);z-index:10;align-items:center;justify-content:center}
#ovl.open{display:flex}
#panel{background:#142038;border-radius:1.2rem;padding:1rem 1.4rem;text-align:center;max-width:96%;max-height:98%;overflow:hidden}
.ptitle2{font-size:2rem;color:#e6edf8;margin-bottom:.3rem}
.psub{font-size:1.4rem;color:#8da2c4;margin-bottom:.5rem}
.pdots{height:1.8rem;margin-bottom:.2rem}
.pdots i{display:inline-block;width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid #5aa9ff;margin:0 .5rem;vertical-align:middle}
.pdots i.f{background:#5aa9ff}
.pmsg{min-height:1.7rem;font-size:1.4rem;color:#ffb4b4;margin-bottom:.2rem}
.pad{width:21rem;margin:0 auto}
.k{display:inline-block;width:6.4rem;height:4.2rem;margin:.3rem;border-radius:.8rem;background:#1e3050;color:#fff;font-size:2.4rem;line-height:4.2rem;text-align:center;cursor:pointer}
.k.sm{font-size:1.8rem;color:#c9d4e6}
.qg{margin:0 auto}
.land .qg{width:52rem}
.port .qg{width:26rem}
.q{display:inline-block;width:8rem;height:4.2rem;margin:.3rem;border-radius:.8rem;background:#1e3050;color:#e6edf8;font-size:2rem;line-height:4.2rem;text-align:center;cursor:pointer}
.q.on{background:#2b6fd1;color:#fff}
.crow{font-size:1.8rem;color:#e6edf8;margin:.2rem 0 .5rem;line-height:4rem}
.crow .creg{color:#8da2c4;font-size:1.5rem}
.crow .act{margin:0 0 0 1rem;height:3.4rem;line-height:3.4rem;font-size:1.5rem}
.cin{width:96%;margin:0 auto .4rem;min-height:3.6rem;line-height:3.6rem;font-size:2.4rem;color:#fff;background:#0e182b;border-bottom:2px solid #5aa9ff;border-radius:.6rem .6rem 0 0;text-align:left;padding:0 1rem;white-space:nowrap;overflow:hidden}
.cin .ph{color:#5d6f90;font-size:1.8rem}
.cin .cur{color:#5aa9ff}
.cres{margin:0 auto .3rem;overflow:hidden;text-align:left}
.land .cres{height:8.6rem}
.port .cres{height:21rem}
.cr{display:inline-block;vertical-align:top;box-sizing:border-box;margin:.2rem;padding:.35rem 1rem;border-radius:.8rem;background:#1e3050;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;height:4rem}
.land .cr{width:calc(33.33% - .4rem)}
.port .cr{width:calc(100% - .4rem);height:3.4rem;padding:.2rem 1rem}
.cr b{display:block;font-size:1.8rem;font-weight:500;color:#fff;line-height:1.7rem;overflow:hidden;text-overflow:ellipsis}
.cr span{display:block;font-size:1.2rem;color:#8da2c4;overflow:hidden;text-overflow:ellipsis;line-height:1.7rem}
.cmsg{font-size:1.5rem;color:#8da2c4;padding:.5rem 1rem}
.kb{text-align:center}
.kk{display:inline-block;vertical-align:top;margin:.25rem;border-radius:.7rem;background:#1e3050;color:#fff;text-align:center;cursor:pointer;width:4.7rem;height:3.2rem;line-height:3.2rem;font-size:2rem}
.kk.sm{font-size:1.5rem;color:#c9d4e6}
.land .kk.wide{width:24rem}
.land .kk.mid{width:8rem}
.port .kk{width:2.9rem;height:3.8rem;line-height:3.8rem;margin:.15rem}
.port .kk.wide{width:10rem}
.port .kk.mid{width:7rem}
.act{display:inline-block;padding:0 1.6rem;height:4rem;line-height:4rem;margin:.6rem .4rem 0;border-radius:.8rem;background:#1e3050;font-size:1.7rem;color:#c9d4e6;cursor:pointer}
/* Анімація значків (вимикається параметром anim=0) */
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes drift{0%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}100%{transform:translateX(-1.5px)}}
.anim .rays{transform-origin:32px 32px;animation:spin 40s linear infinite}
.anim .cloudg{animation:drift 8s ease-in-out infinite}
/* Вертикальна розкладка */
.port #top{flex-direction:column}
.port #left{flex:none;width:auto;padding-top:1rem}
.port #clock{font-size:9.4rem}
.port #wx{flex:none;width:auto;margin-left:0;margin-top:1.2rem}
.port #bottom{flex-direction:column;height:auto}
.port #bottom .card{margin-right:0;margin-bottom:1rem;flex:none;width:auto;height:5.8rem}
.port #bottom .card:last-child{margin-bottom:0}
.port #bottom #powercard{height:7.8rem}
.port #sun{justify-content:flex-start}
/* Нічний режим */
.night,.night body{background:#000;color:#8b949e}
.night #date,.night #sec,.night .sunitem,.night .soon h4,.night #status{color:#5d6672}
.night .sunitem b,.night .soon p{color:#8b949e}
.night #frametrack{stroke:rgba(255,255,255,.07)}
.night #frameprog{stroke:#2f4d78}
.night .card{background:#0b0f15;border:1px solid #161c25}
.night #wx{background:#0b0f15}
.night #wxhead,.night #nexthour,.night .stat{color:#6b7480}
.night .stat b,.night #temp,.night .day{color:#9aa3ad}
.night .daytemp span{color:#5d6672}
.night #wxdetails,.night #days{border-top-color:#1b222c}
.night .soon{background:transparent;border:1px dashed #1f2733}
.night .pbar{filter:brightness(.6);-webkit-filter:brightness(.6)}
.night #pstatus{filter:brightness(.65);-webkit-filter:brightness(.65)}
.night #pnow{background:#9aa3ad}
.night #phead,.night .plbl,.night #pticks{color:#5d6672}
.night #gear{opacity:.18}
.night #wxicon svg,.night .dayicon svg{-webkit-filter:brightness(.55) saturate(.6);filter:brightness(.55) saturate(.6)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="left">
      <div id="date">&nbsp;</div>
      <div id="clockwrap"><svg id="frame" xmlns="http://www.w3.org/2000/svg"><path id="frametrack"/><path id="frameprog" pathLength="100"/></svg><div id="clock"><span id="hm">--:--</span><span id="sec"></span></div></div>
      <div id="sun">
        <div class="sunitem">схід<b id="sunrise">--:--</b></div>
        <div class="sunitem">захід<b id="sunset">--:--</b></div>
        <div class="sunitem">день<b id="daylen">--:--</b></div>
      </div>
    </div>
    <div id="wx" class="card">
      <div id="wxhead"><span id="city"></span><span id="wxwarn"></span></div>
      <div id="wxmain"><div id="wxicon"></div><div id="temp">--°</div></div>
            <div id="nexthour"></div>
      <div id="wxdetails">
        <div class="stat"><b id="feels">--°</b>відчувається</div>
        <div class="stat"><b id="wind">--</b>вітер</div>
        <div class="stat"><b id="hum">--%</b>вологість</div>
      </div>
      <div id="days"></div>
    </div>
  </div>
  <div id="bottom">
    <div class="card soon" id="alertcard"><h4>Повітряна тривога</h4><p>Буде на наступному кроці</p></div>
    <div class="card" id="powercard">
      <div id="phead"><span id="ptitle">Світло</span><span id="pstatus" class="dim">Завантаження…</span></div>
      <div id="pnone">Графік відключень для цього регіону поки не підключено</div>
      <div class="prow"><span class="plbl">сьогодні</span><div class="pwrap"><div class="pbar" id="pbar0"></div><div id="pnow"></div></div></div>
      <div class="prow thin"><span class="plbl">завтра</span><div class="pwrap"><div class="pbar" id="pbar1"></div></div></div>
      <div class="prow"><span class="plbl"></span><div id="pticks"><span style="left:0%">0</span><span style="left:8.3333%">2</span><span style="left:16.6667%">4</span><span style="left:25%">6</span><span style="left:33.3333%">8</span><span style="left:41.6667%">10</span><span style="left:50%">12</span><span style="left:58.3333%">14</span><span style="left:66.6667%">16</span><span style="left:75%">18</span><span style="left:83.3333%">20</span><span style="left:91.6667%">22</span><span style="left:100%">24</span></div></div>
    </div>
  </div>
  <div id="gear"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="currentColor" stroke-linecap="round"><circle cx="12" cy="12" r="5" stroke-width="2.4"/><g stroke-width="3.2"><line x1="12" y1="2" x2="12" y2="5.2"/><line x1="12" y1="2" x2="12" y2="5.2" transform="rotate(45 12 12)"/><line x1="12" y1="2" x2="12" y2="5.2" transform="rotate(90 12 12)"/><line x1="12" y1="2" x2="12" y2="5.2" transform="rotate(135 12 12)"/><line x1="12" y1="2" x2="12" y2="5.2" transform="rotate(180 12 12)"/><line x1="12" y1="2" x2="12" y2="5.2" transform="rotate(225 12 12)"/><line x1="12" y1="2" x2="12" y2="5.2" transform="rotate(270 12 12)"/><line x1="12" y1="2" x2="12" y2="5.2" transform="rotate(315 12 12)"/></g></g></svg></div>
  <div id="ovl"><div id="panel"></div></div>
  <div id="status"></div>
</div>

<script>
(function () {
  'use strict';

  var APP_VERSION = '0.4.0';

  // ---------- Налаштування ----------
  // Їх можна змінити параметрами в посиланні, один раз: ?name=Вінниця&lat=49.2331&lon=28.4682
  // Після цього вони запам'ятовуються на пристрої. Скинути: ?reset=1
  // view: auto | land | port    night: auto | on | off | 22:00-07:00    secs: 0|1    anim: 0|1
  var DEFAULTS = { name: 'Вінниця', region: 'Вінницька область', lat: 49.2331, lon: 28.4682, view: 'auto', night: 'auto', secs: 0, anim: 1, queue: '' };
  var STORE_CFG = 'wd_cfg', STORE_WX = 'wd_weather', STORE_RELOAD = 'wd_reload_day', STORE_PIN = 'wd_pin', STORE_PW = 'wd_power2';

  var WEATHER_EVERY = 10 * 60 * 1000;   // оновлення погоди раз на 10 хв
  var WEATHER_RETRY = 60 * 1000;        // повтор після помилки
  var STALE_AFTER = 30 * 60 * 1000;     // після цього дані вважаються застарілими
  var UPDATE_CHECK_EVERY = 5 * 60 * 1000; // перевірка нової версії сторінки

  var WD = ['неділя', 'понеділок', 'вівторок', 'середа', 'четвер', "п'ятниця", 'субота'];
  var MON = ['січня', 'лютого', 'березня', 'квітня', 'травня', 'червня', 'липня', 'серпня', 'вересня', 'жовтня', 'листопада', 'грудня'];

  function $(id) { return document.getElementById(id); }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function setText(el, v) { if (el._v !== v) { el._v = v; el.textContent = v; } }
  function setHtml(el, v) { if (el._h !== v) { el._h = v; el.innerHTML = v; } }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }

  // ---------- Читання налаштувань ----------
  function parseQuery() {
    var out = {}, s = window.location.search.replace(/^\?/, '');
    if (!s) return out;
    var parts = s.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      try { out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' ')); } catch (e) {}
    }
    return out;
  }
  function coerce(k, v) {
    if (k === 'lat' || k === 'lon') { var f = parseFloat(v); return isNaN(f) ? DEFAULTS[k] : f; }
    if (k === 'secs' || k === 'anim') { return parseInt(v, 10) ? 1 : 0; }
    if (k === 'queue') { return /^[1-6]\.[12]$/.test(v) ? v : ''; }
    return v;
  }
  function loadCfg() {
    var cfg = {}, k;
    for (k in DEFAULTS) { if (DEFAULTS.hasOwnProperty(k)) cfg[k] = DEFAULTS[k]; }
    var q = parseQuery();
    if (q.reset === '1') { lsDel(STORE_CFG); lsDel(STORE_WX); return cfg; }
    var stored = null;
    try { stored = JSON.parse(lsGet(STORE_CFG) || 'null'); } catch (e) {}
    if (stored) { for (k in stored) { if (DEFAULTS.hasOwnProperty(k)) cfg[k] = stored[k]; } }
    var changed = false;
    for (k in DEFAULTS) {
      if (DEFAULTS.hasOwnProperty(k) && q.hasOwnProperty(k)) { cfg[k] = coerce(k, q[k]); changed = true; }
    }
    // Місто задали параметрами без області: область невідома, графік світла вимкнеться
    if ((q.hasOwnProperty('lat') || q.hasOwnProperty('name')) && !q.hasOwnProperty('region')) cfg.region = '';
    if (changed) lsSet(STORE_CFG, JSON.stringify(cfg));
    return cfg;
  }
  var cfg = loadCfg();
  function saveCfg() { lsSet(STORE_CFG, JSON.stringify(cfg)); }
  var ovlOpen = false;
  // Якщо забули PIN: відкрити сторінку з ?resetpin=1 (потім відкрити звичайне посилання)
  if (parseQuery().resetpin === '1') lsDel(STORE_PIN);

  // ---------- Значки погоди (вбудовані SVG, без зовнішніх файлів) ----------
  var CLOUD = '<path d="M20 48h27a11 11 0 0 0 1.6-21.9A15 15 0 0 0 19.6 29 10 10 0 0 0 20 48z" fill="#e3e9f2"/>';
  var CLOUD_BACK = '<path d="M20 48h27a11 11 0 0 0 1.6-21.9A15 15 0 0 0 19.6 29 10 10 0 0 0 20 48z" fill="#9aa8bd"/>';
  function sunShape() {
    var s = '<g class="rays" stroke="#ffc83d" stroke-width="3.2" stroke-linecap="round">', a;
    for (a = 0; a < 360; a += 45) { s += '<line x1="32" y1="9" x2="32" y2="15" transform="rotate(' + a + ' 32 32)"/>'; }
    return s + '</g><circle cx="32" cy="32" r="11" fill="#ffc83d"/>';
  }
  var MOON = '<path d="M40 10A22 22 0 1 0 54 42 17 17 0 0 1 40 10z" fill="#dfe6f2"/>';
  function cloudG(t) { return '<g class="cloudg"' + (t ? ' transform="' + t + '"' : '') + '>' + CLOUD + '</g>'; }

  // Код погоди Open-Meteo -> текст і тип значка
  function wxInfo(c) {
    if (c === 0) return { t: 'Ясно', k: 'clear' };
    if (c === 1) return { t: 'Переважно ясно', k: 'clear' };

  // ---------- Нічний режим ----------
  function isNight(d) {
    var mode = String(cfg.night), now = d.getHours() * 60 + d.getMinutes();

    var m = /^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/.exec(mode), a, b;
    if (m) {

      b = parseInt(m[3], 10) * 60 + parseInt(m[4], 10);
    } else if (sunRise !== null && sunSet !== null) {
      a = sunSet; b = sunRise;               // від заходу до сходу сонця
    } else { a = 22 * 60; b = 7 * 60; }      // поки немає даних про сонце
    return a <= b ? (now >= a && now < b) : (now >= a || now < b);
  }

  // ---------- Світло: джерела графіків (провайдери) ----------

  //   match(cfg) - чи підходить цей регіон (за областю з налаштувань міста)

  var POWER_EVERY = 5 * 60 * 1000, POWER_RETRY = 60 * 1000;
  var POWER_STALE_FETCH = 30 * 60 * 1000;   // давно не вдавалось завантажити
  var POWER_STALE_SRC = 90 * 60;            // джерело саме давно не оновлювалось (секунди)
  var QUEUES = ['1.1', '1.2', '2.1', '2.2', '3.1', '3.2', '4.1', '4.2', '5.1', '5.2', '6.1', '6.2'];
  // Слот = 1 година, ділимо навпіл: g світло є, r немає, y можливе відключення

  var CODE = { yes: 'gg', no: 'rr', first: 'rg', second: 'gr', maybe: 'yy', mfirst: 'yg', msecond: 'gy' };
  function cellsOf(slots) {

    for (h = 1; h <= 24; h++) { c = CODE[slots[String(h)]] || 'gg'; out.push(c.charAt(0), c.charAt(1)); }
    return out;

  var PROVIDERS = [{

  function providerFor(c) {

  function renderPower() {
    var box = $('powercard'), q = cfg.queue, nowSec = new Date().getTime() / 1000, now = $('pnow');
    toggleCls(box, 'noprov', !prov);
    if (!prov) {
      setText($('ptitle'), 'Світло');
      showStatus('', 'dim');
      toggleCls(box, 'stale', false);
      setHtml($('pbar0'), barHtml(null, -1)); setHtml($('pbar1'), barHtml(null, -1));

    }

  }

  // ---------- Шестерня: PIN, місто, черга ----------
  // PIN лише захищає від випадкових дотиків (діти, гості); це не справжній захист
  var GEO_URL = 'https://geocoding-api.open-meteo.com/v1/search?name=';

  var cityQ = '', cityRes = [], cityMsg = '', cityTimer = null, cityReq = 0;

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function hashPin(pin) {
    var h = 5381, str = 'wd|' + pin, i;

      for (j = 0; j < r.length; j++) h += '<span class="kk" data-k="ch:' + r.charAt(j) + '">' + r.charAt(j) + '</span>';
      h += '</div>';
    }
    return h + '<div><span class="kk mid sm" data-k="cback">Назад</span><span class="kk" data-k="ch:\'">\'</span>' +
      '<span class="kk wide sm" data-k="cspace">пробіл</span><span class="kk mid" data-k="cdel">←</span></div></div>';
  }
  function panelHtml() {
    var h = '', i, r;
    if (mode === 'settings') {
      h += '<div class="ptitle2">Налаштування</div>';
      h += '<div class="crow">Місто: <b>' + esc(cfg.name) + '</b>' + (cfg.region ? '<span class="creg"> · ' + esc(cfg.region) + '</span>' : '') +
        '<span class="act" data-k="city">Змінити місто</span></div>';
      if (prov) {
        h += '<div class="psub">Черга відключень · ' + esc(prov.name) + '</div><div class="qg">';
        for (i = 0; i < prov.queues.length; i++) {
          h += '<div class="q' + (prov.queues[i] === cfg.queue ? ' on' : '') + '" data-k="q:' + prov.queues[i] + '">' + prov.queues[i] + '</div>';
        }
        h += '</div>';
      } else {
        h += '<div class="psub">Графік відключень для цього регіону поки не підключено</div>';
      }
      return h + '<div><span class="act" data-k="chpin">Змінити PIN</span><span class="act" data-k="close">Закрити</span></div>';
    }
    if (mode === 'city') {
      h += '<div class="ptitle2">Місто або населений пункт</div>';
      h += '<div class="cin">' + (cityQ ? esc(cityQ) + '<span class="cur">|</span>' : '<span class="ph">Почніть вводити назву…</span>') + '</div><div class="cres">';
      if (cityMsg) h += '<div class="cmsg">' + cityMsg + '</div>';
      for (i = 0; i < cityRes.length; i++) {
        r = cityRes[i];
        h += '<div class="cr" data-k="c:' + i + '"><b>' + esc(r.name) + '</b><span>' +
          esc([r.admin1, r.admin2].filter(function (x) { return x; }).join(', ')) + '</span></div>';
      }
      return h + '</div>' + kbHtml();
    }
    var titles = { enter: 'Введіть PIN', create1: 'Придумайте PIN з 4 цифр', create2: 'Повторіть PIN', newpin1: 'Новий PIN з 4 цифр', newpin2: 'Повторіть новий PIN' };
    h += '<div class="ptitle2">' + titles[mode] + '</div><div class="pdots">';
    for (i = 0; i < 4; i++) h += '<i' + (i < pinBuf.length ? ' class="f"' : '') + '></i>';
    h += '</div><div class="pmsg">' + msg + '</div><div class="pad">';
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'close', '0', 'del'];
    for (i = 0; i < keys.length; i++) {
      h += '<div class="k' + (keys[i].length > 1 ? ' sm' : '') + '" data-k="' + keys[i] + '">' +
        (keys[i] === 'close' ? 'Закрити' : (keys[i] === 'del' ? '←' : keys[i])) + '</div>';
    }
    return h + '</div>';
  }
  function drawPanel() { setHtml($('panel'), panelHtml()); }
  function armIdle() { if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(closePanel, 60000); }
  function openPanel() {
    ovlOpen = true; pinBuf = ''; pinTmp = ''; msg = '';
    mode = lsGet(STORE_PIN) ? 'enter' : 'create1';
    $('ovl').className = 'open';
    drawPanel(); armIdle();
  }
  function closePanel() {
    ovlOpen = false; mode = ''; pinBuf = ''; msg = '';
    if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
    if (cityTimer) { clearTimeout(cityTimer); cityTimer = null; }
    $('ovl').className = '';
    $('panel')._h = null;
  }
  function submitPin() {
    var now = new Date().getTime();
    if (mode === 'enter') {
      if (hashPin(pinBuf) === lsGet(STORE_PIN)) { mode = 'settings'; fails = 0; msg = ''; }
      else {
        fails++; msg = 'Невірний PIN';
        if (fails >= 3) { lockUntil = now + 30000; fails = 0; msg = 'Забагато спроб, зачекайте 30 с'; }
      }
    } else if (mode === 'create1' || mode === 'newpin1') {
      pinTmp = pinBuf; mode = (mode === 'create1') ? 'create2' : 'newpin2'; msg = '';
    } else if (mode === 'create2' || mode === 'newpin2') {
      if (pinBuf === pinTmp) { lsSet(STORE_PIN, hashPin(pinBuf)); mode = 'settings'; msg = ''; }
      else { mode = (mode === 'create2') ? 'create1' : 'newpin1'; msg = 'PIN не збігся, спробуйте ще раз'; }
    }
    pinBuf = '';
  }

  // Пошук населеного пункту (Open-Meteo Geocoding)
  function searchCity() {
    if (cityTimer) { clearTimeout(cityTimer); cityTimer = null; }
    var q = cityQ.replace(/^\s+|\s+$/g, '');
    cityReq++;
    if (q.length < 2) { cityRes = []; cityMsg = ''; return; }
    cityMsg = 'Шукаю…';
    var my = cityReq;
    cityTimer = setTimeout(function () {
      getJSON(GEO_URL + encodeURIComponent(q) + '&count=6&language=uk&countryCode=UA&format=json', function (d) {
        if (my !== cityReq || mode !== 'city') return;
        cityRes = d.results || [];
        cityMsg = cityRes.length ? '' : 'Нічого не знайдено';
        drawPanel();
      }, function () {
        if (my !== cityReq || mode !== 'city') return;
        cityRes = []; cityMsg = 'Немає зв’язку із сервісом пошуку';
        drawPanel();
      });
    }, 450);
  }
  function chooseCity(r) {
    cfg.name = r.name; cfg.region = r.admin1 || '';
    cfg.lat = r.latitude; cfg.lon = r.longitude;
    saveCfg();
    resetWeatherView();
    prov = providerFor(cfg);
    loadPwCache();
    renderPower();
    loadWeather();
    loadPower();
    mode = 'settings';
  }

  function onKey(k) {
    armIdle();
    if (k === 'close') { closePanel(); return; }
    if (k === 'chpin') { mode = 'newpin1'; pinBuf = ''; msg = ''; drawPanel(); return; }
    if (k === 'city') { mode = 'city'; cityQ = ''; cityRes = []; cityMsg = ''; cityReq++; drawPanel(); return; }
    if (k.indexOf('q:') === 0) { cfg.queue = k.substr(2); saveCfg(); renderPower(); drawPanel(); return; }
    if (mode === 'city') {
      if (k === 'cback') { mode = 'settings'; drawPanel(); return; }
      if (k.indexOf('c:') === 0) { var r = cityRes[parseInt(k.substr(2), 10)]; if (r) chooseCity(r); drawPanel(); return; }
      if (k === 'cdel') cityQ = cityQ.slice(0, -1);
      else if (k === 'cspace') { if (cityQ.length < 30) cityQ += ' '; }
      else if (k.indexOf('ch:') === 0) { if (cityQ.length < 30) cityQ += k.substr(3); }
      searchCity();
      drawPanel();
      return;
    }
    if (mode === 'enter' && new Date().getTime() < lockUntil) {
      msg = 'Зачекайте ' + Math.ceil((lockUntil - new Date().getTime()) / 1000) + ' с'; drawPanel(); return;
    }
    msg = '';
    if (k === 'del') { pinBuf = pinBuf.slice(0, -1); }
    else if (pinBuf.length < 4) { pinBuf += k; }
    if (pinBuf.length === 4) submitPin();
    drawPanel();
  }
  $('gear').addEventListener('click', function (e) { e.stopPropagation(); openPanel(); });
  $('ovl').addEventListener('click', function (e) {
    e.stopPropagation();
    var t = e.target;
    while (t && t !== this && !t.getAttribute('data-k')) t = t.parentNode;
    if (!t || t === this) { if (e.target === this) closePanel(); return; }
    onKey(t.getAttribute('data-k'));
  });

  // ---------- Рамка навколо годин: заповнюється по колу за 60 секунд ----------
  var frameBox = $('clockwrap'), frameSvg = $('frame'), frameTrack = $('frametrack'), frameProg = $('frameprog');
  var frameKey = '', frameInit = false;
  function layoutFrame() {
    var w = frameBox.offsetWidth, h = frameBox.offsetHeight, fs = rootEl._fs || 10.8;
    var key = w + 'x' + h + 'x' + fs;
    if (!w || key === frameKey) return;
    frameKey = key;
    var sw = fs * 0.35, i = sw / 2, W = w - sw, H = h - sw, cx = w / 2;
    var r = Math.min(fs * 2.4, H / 2 - 1);
    // Контур починається зверху по центру і йде за годинниковою стрілкою
    var dd = 'M' + cx + ',' + i + ' H' + (i + W - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (i + W) + ',' + (i + r) +
      ' V' + (i + H - r) + ' A' + r + ',' + r + ' 0 0 1 ' + (i + W - r) + ',' + (i + H) +
      ' H' + (i + r) + ' A' + r + ',' + r + ' 0 0 1 ' + i + ',' + (i + H - r) +
      ' V' + (i + r) + ' A' + r + ',' + r + ' 0 0 1 ' + (i + r) + ',' + i + ' H' + cx;
    frameSvg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    frameTrack.setAttribute('d', dd); frameProg.setAttribute('d', dd);
    frameTrack.setAttribute('stroke-width', sw); frameProg.setAttribute('stroke-width', sw);
  }
  function updateFrame(d) {
    var sec = d.getSeconds();
    if (!cfg.anim) { frameProg.style.strokeDashoffset = 100 - sec / 60 * 100; return; }
    if (sec === 0 || !frameInit) {          // новий оберт: скидаємо без анімації
      frameInit = true;
      frameProg.style.transition = 'none';
      frameProg.style.strokeDashoffset = 100 - sec / 60 * 100;
      void frameProg.getBoundingClientRect();
    }
    // Плавно доїжджаємо до позиції наступної секунди
    frameProg.style.transition = 'stroke-dashoffset 1s linear';
    frameProg.style.strokeDashoffset = 100 - (sec + 1) / 60 * 100;
  }

  // ---------- Годинник і щосекундний цикл ----------
  var lastMinute = -1;
  function tick() {
    var d = new Date(), mi = d.getMinutes();
    setText($('hm'), pad2(d.getHours()) + ':' + pad2(mi));
    if (cfg.secs) setText($('sec'), pad2(d.getSeconds()));
    setText($('date'), WD[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()]);
    applyClasses(d);
    layoutFrame();
    updateFrame(d);

    if (mi !== lastMinute) {            // раз на хвилину
      lastMinute = mi;
      renderWeather();
      renderPower();
      if (!wlOk) lockScreen();
      // Нічне перезавантаження о 04:00 проти витоків пам'яті (раз на добу)
      if (d.getHours() === 4 && mi === 0 && lsGet(STORE_RELOAD) !== dayStr(d)) {
        lsSet(STORE_RELOAD, dayStr(d));
        window.location.reload();
        return;
      }
    }
    setTimeout(tick, 1000 - (d.getTime() % 1000) + 20);
  }

  // ---------- Старт ----------
  if (!cfg.secs) $('sec').style.display = 'none';
  updateStatus();
  renderWeather();   // одразу малюємо кеш, якщо він є
  renderPower();
  tick();
  loadWeather();
  loadPower();
  lockScreen();
})();
</script>
</body>
</html>
